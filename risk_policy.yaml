# risk_policy.yaml -- versioned, machine-readable single source of policy
# (paper Sec. IV/2.4). mediation_gateway.py reads this file; no
# heuristic/hand-embedded threshold VALUE is kept in code.
#
# NOTE (translated for the reproducibility artifact): this is a translated
# copy of the versioned policy file that governed the reported
# experiments, for reviewer readability. The real, running system consumes
# the original Turkish-keyed file; the numeric values, booleans, and stage
# numbering below are unchanged.
policy_version: "1.1.0"
# The SHA-256 digest is recomputed by the build/test script whenever the
# file changes and written to mediation_gateway's log (Sec. 2.4
# "must be verifiable as loaded with its version/hash" requirement).

stages:
  1: {name: "Water Crossing",      risk_class: low,  resume_allowed: true,  skip_allowed_shared_channel: false}
  2: {name: "Rocky Road",          risk_class: low,  resume_allowed: true,  skip_allowed_shared_channel: false}
  3: {name: "Side Slope",          risk_class: low,  resume_allowed: true,  skip_allowed_shared_channel: false}
  4: {name: "Steep Obstacle",      risk_class: low,  resume_allowed: true,  skip_allowed_shared_channel: false}
  5: {name: "Cone Slalom",         risk_class: low,  resume_allowed: true,  skip_allowed_shared_channel: false}
  6: {name: "Sliding Obstacle",    risk_class: low,  resume_allowed: true,  skip_allowed_shared_channel: false}
  7: {name: "Rough Terrain",       risk_class: low,  resume_allowed: true,  skip_allowed_shared_channel: false}
  8: {name: "Steep Slope Ascent",  risk_class: high, resume_allowed: false, skip_allowed_shared_channel: false}
  9: {name: "Firing",              risk_class: waypointless, resume_allowed: false, skip_allowed_shared_channel: false}
  10: {name: "Steep Slope Descent", risk_class: high, resume_allowed: false, skip_allowed_shared_channel: false}

# SKIP is NOT permitted by default from the shared (LLM/UI) channel at any
# stage (paper Stage A) -- only if a separate, SROS2-authorized operator
# channel is opened would a policy for that channel be defined separately.
# That channel does NOT exist in this Regular Paper window; all remain false.

single_stage_test_mode:
  active_from_shared_channel: false  # R4: START target_stage>0 is ALWAYS denied from the mediation channel
  test_enclave_only: true  # becomes active only if a separate identity is defined via SROS2 (post-Stage C, NOT in this plan)

telemetry_freshness_thresholds:
  mission_status_max_age_s: 2.0
  battery_max_age_s: 5.0
  tf_odom_max_age_s: 1.0

battery:
  min_percentage: 0.20

position_tolerance:
  sign_jump_max_distance_m: 7.0

# Missing/stale/NaN/invalid/contradictory data produces a DENY BY DEFAULT
# (paper Sec. 2.3). The ABORT/ESTOP exception is explicitly encoded in R3
# and is not repeated separately in this policy file.
fail_closed_default: true
